<title>Comment Browser</title><style>
:root{--bg:#FBF5EF;--card:#fff;--ink:#2B1E23;--muted:#7B6A70;--line:#EBDCD6;--hot:#C8325F;--soft:#FCEDEA}
@media (prefers-color-scheme:dark){:root{--bg:#1c1518;--card:#271e22;--ink:#f3e9ec;--muted:#b19fa5;--line:#3a2d32;--soft:#352529}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}

.bar{display:flex;gap:8px;flex-wrap:wrap}input[type=search]{flex:1;min-width:180px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font-size:16px}

.chip.on{background:var(--hot);border-color:var(--hot);color:#fff}.chip small{opacity:.7}
main{max-width:760px;margin:0 auto;padding:12px 16px 60px}.count{color:var(--muted);font-size:13px;margin:4px 0 10px}

.r:last-child{border:0}.r small{color:var(--muted)}.more{display:block;margin:10px auto;padding:10px 18px;border:1px solid var(--line);border-radius:99px;background:var(--card);color:var(--ink);cursor:pointer}
details{margin:6px 0 0}summary{cursor:pointer;color:var(--muted);font-size:13px}.ph{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.ph span{background:var(--soft);border-radius:99px;padding:2px 10px;font-size:13px;cursor:pointer}

<script>
const D={"title": "@askaurea — What's something a family member said that you'll never fully forgive?", "comments": [{"n": 1, "t": "My brother died unexpectedly. My mother turned to me and said it should’ve been you and not him. in front of my two children.", "l": 83348, "r": 25, "c": ["Other"]}, {"n": 2, "t": "My uncle said that Chris Hansen should be arrested for entrapment. The end. He never saw me or my kids again.", "l": 48265, "r": 24, "c": ["Other"]}, {"n": 3, "t": "My sons dad dumped me when he found out we were pregnant. His parents were still thrilled and wanted to be a part of my sons life, but stopped calling cold turkey about 4 months into the pregnancy. I found out years later that my mother called them & said I had an abortion and to never call again. My son is 22 and we all have a great relationship with his grandparents-they are wonderful people! There has been no contact for years with their son and my mother.", "l": 41457, "r": 30, "c": ["Other"]}, {"n": 4, "t": "I got into college and at my high school graduation my dad turned to me and said “just because you accomplished something doesn’t mean you are better than me”. Last day I ever spoke to him.", "l": 29527, "r": 22, "c": ["💼 Career & money"]}, {"n": 5, "t": "“You have to get a job!” I was only 43💔😭", "l": 27314, "r": 51, "c": ["💼 Career & money"]}, {"n": 6, "t": "My step dad openly admitting in front of family and friends that he treated me badly on purpose because he knew my mom wouldn’t do anything. Sad part is he was right. She never did anything", "l": 21176, "r": 12, "c": ["Other"]}, {"n": 7, "t": "My husband died by car accident that wasn’t his fault. Someone told me that I should feel terrible for the drivers that caused the accident because they had a baby! Ummm what about our kids?", "l": 20566, "r": 7, "c": ["💍 Relationships", "❓ Questions"]}, {"n": 8, "t": "That I would be the first one pregnant and wouldn’t amount to anything 🥹 I own my own home, car, was the LAST to have my son, and I graduate with my master’s next year 🙏🏾😎♥️", "l": 13437, "r": 30, "c": ["Other"]}, {"n": 9, "t": "I have six kids. My parents had a big pond in the front their house. Me and my husband would always be worried about the kids around it. My sister in law said what’s the big deal if you lose one you have five other children. I never looked at her the same after that! Pure evil!!", "l": 11561, "r": 24, "c": ["💍 Relationships"]}, {"n": 10, "t": "I’m homeless in another state. I was saving money and my sister called and asked to borrow some. I gave her 150$ (more than she asked for) and told her to pay me back what she asked for. She never did. Fast forward a few months and I need money. I asked my sister and she said “people have lives too.”", "l": 11555, "r": 20, "c": ["Other"]}, {"n": 11, "t": "When I was pregnant, my baby’s father said if I had a boy he would be in the child’s life and if I had a girl he would not. I had a girl. He didn’t lie.", "l": 10721, "r": 17, "c": ["❓ Questions"]}, {"n": 12, "t": "it may sound so stupid but my mom AND dad called me a failure. since then I lost any interest in studying and everything in general.", "l": 9464, "r": 48, "c": ["Other"]}, {"n": 13, "t": "Me crying and my mom turning to my brother with a smile like “isn’t she so dramatic?” And my brother turning to comfort me. I’ll never forget her cruelty or his kindness.", "l": 9062, "r": 12, "c": ["Other"]}, {"n": 14, "t": "My sister told me that the SA didn’t happen because our uncle never did it to her", "l": 7567, "r": 15, "c": ["Other"]}, {"n": 15, "t": "my parents told me they only raised me to take care of them in the future", "l": 7178, "r": 21, "c": ["Other"]}, {"n": 16, "t": "From my Mom “You are a disappointment.” For not aligning with her MAGA views.", "l": 7011, "r": 20, "c": ["Other"]}, {"n": 17, "t": "A week after telling my mom her husband had been abusing me in various ways I asked if she was going to do anything about it or help me at all. She screamed at me asking ‘what about my house and my car and my marriage and my life?’ That was almost ten years ago and I think about it every. Single. Day. Sometimes for hours, wondering how someone could choose their second husband over their only daughter", "l": 6216, "r": 20, "c": ["💍 Relationships"]}, {"n": 18, "t": "I was blamed by my aunt for my grandmother’s fatal stroke. I was 9.", "l": 4276, "r": 4, "c": ["Other"]}, {"n": 19, "t": "Being a law enforcement officer and watching my own sister chant “Death to the Pigs” on her Instagram then try an delete it and tell me I’m making it up. That was 2016 I’m still not okay with it. I’ve since retired but still man I’m your little brother.", "l": 3941, "r": 37, "c": ["Other"]}, {"n": 20, "t": "“It’s such a shame you’re not pretty like your cousin,” my grandma. I was like 4 or 5, never forgot it.", "l": 3841, "r": 6, "c": ["Other"]}, {"n": 21, "t": "My husband needed life saving surgery 300 miles from home while in a trip. I asked my mom to watch her grand daughter for ine night so I could drive up for the surgery and come home the next.morning. She said no because she had a hair appointment. That was the day I went completely numb. Didn't talk to my mother for years. Still numb to her.", "l": 3683, "r": 15, "c": ["💍 Relationships"]}, {"n": 22, "t": "Me being responsible for my drug addict mom through high school & being pressured to graduate then finding my mom dead two months before graduation just for my family to tell me it was my fault when every-time I called for help with her they never came.", "l": 3661, "r": 26, "c": ["Other"]}, {"n": 23, "t": "“Go have kids already”….after we did at least 6 rounds of ivf and failed", "l": 3219, "r": 4, "c": ["Other"]}, {"n": 24, "t": "I went back to school to get my Degree. Sister in law told me I would never make it. I proved her wrong! I graduated as Valedictorian 🎓", "l": 3052, "r": 20, "c": ["💼 Career & money"]}, {"n": 25, "t": "‘We can’t miss our casino nights. Your father worked hard and deserves time off’-the excuse as to why grandparents never came to see their dying grandson…", "l": 2991, "r": 9, "c": ["Other"]}, {"n": 26, "t": "Oh my heart reading all these 😔", "l": 2437, "r": 3, "c": ["Other"]}, {"n": 27, "t": "My dad lived in another state, my mom was on drugs, I house surfed trying to avoid cps catching wind. I called my dad and ask for some money for food, he said legally he didn’t have to give me anything bc I quit school. I quit school bc I didn’t have housing. I was 15", "l": 2432, "r": 12, "c": ["Other"]}, {"n": 28, "t": "When I was 17 my father told me everytime I see your face I feel disappointed. I’m 34 now and haven’t spoken to him since.", "l": 2327, "r": 14, "c": ["❓ Questions"]}, {"n": 29, "t": "“You’re lying, he would never do that”", "l": 1878, "r": 15, "c": ["Other"]}, {"n": 30, "t": "wake up it's time for school💔", "l": 1837, "r": 3, "c": ["Other"]}, {"n": 31, "t": "My child had a chronic genetic illness and my mom told me it was all my fault because I didn’t go to church. That this was god punishing me.", "l": 1584, "r": 11, "c": ["Other"]}, {"n": 32, "t": "Mother told me she wished I was dead. I was 7.", "l": 1542, "r": 16, "c": ["Other"]}, {"n": 33, "t": "I was 8 helping my dad pour concrete ditches he told me I was worthless I was his only help trying as hard as I could I’m still working construction 20 years later but he wonders why I don’t talk to him now", "l": 1477, "r": 22, "c": ["Other"]}, {"n": 34, "t": "I overheard my mother talking to my aunt a few weeks after my older brother died she said \"I just dont know why it couldnt have been her instead.\"", "l": 1330, "r": 13, "c": ["Other"]}, {"n": 35, "t": "My heart goes out to all of you posting here. Hugs!", "l": 1135, "r": 0, "c": ["Other"]}, {"n": 36, "t": "\"So, when are you going to get yourself a boyfriend?\" My father asked me this just two months after my fiancé lost his battle with cancer.", "l": 1007, "r": 2, "c": ["💍 Relationships"]}, {"n": 37, "t": "My brother telling our mother on hospice care that he would not be coming to her funeral. There was no bad blood between them. He just wasn't coming. When she died he immediately booked a flight to come for her funeral. WTF!", "l": 972, "r": 8, "c": ["Other"]}, {"n": 38, "t": "It’s not really something she said but, I tried to tell my mom about my DV an she would call my abusers family and tell them what I said. They would then tell him and I would get abused worse and worse. I am completely no contact with her now.", "l": 935, "r": 5, "c": ["Other"]}, {"n": 39, "t": "My mom called me a zero that would never amount to anything. She said I ruined her life. I was the product of her affair.", "l": 770, "r": 6, "c": ["Other"]}, {"n": 40, "t": "can i just give all y’all a hug :(", "l": 694, "r": 0, "c": ["❓ Questions"]}, {"n": 41, "t": "When I was moving out of my childhood home because my parents were getting a divorce, my dad asked for my house key back and told me I was not his daughter anymore.", "l": 689, "r": 11, "c": ["💍 Relationships", "❓ Questions"]}, {"n": 42, "t": "Me and my bf been tg since we were 14, when he brought me a gift for my 15th birthday. My mothers sister was otp with her friend and said “my niece must be sucking his yk good” mind you I was 14 and A VIRGIN", "l": 630, "r": 4, "c": ["Other"]}, {"n": 43, "t": "When I was sick, I asked my best friend if he could take me to urgent care and he responded with \"why?\". Days later, I wasn't any better and he told me he couldn't take me because he had to work. I hadn't slept in days and drove to urgent care where they immediately called me an ambulance. I had pneumonia and was hospitalized for 3 days", "l": 627, "r": 7, "c": ["❓ Questions"]}, {"n": 44, "t": "Im an only child and my extended family is in another country. I used to wish I had more family, but after reading these comments, I think Im the lucky one.", "l": 573, "r": 5, "c": ["Other"]}, {"n": 45, "t": "My mom always told me when she was overstimulated that I was going to give her a stroke. Ever since I was little I have had horrible death anxiety. If I call my husband during the day and he doesn’t pick up, I assume a tragic accident has happened.", "l": 570, "r": 4, "c": ["🧠 Mindset & mental health", "💍 Relationships"]}, {"n": 46, "t": "I had a really really bad day at work and left early. My mom's aunt and uncle were visiting. I was to have dinner with them. I was resting in the family room and my dad and uncle were just outside. My uncle asked if I was seeing anyone. My dad replied, \"she's too GD fat, who would want her?\" I got up to confront him. I was so angry and hurt that don't remember what I said to him. I still do not remember driving home.", "l": 546, "r": 3, "c": ["Other"]}, {"n": 47, "t": "I was 8. my cousin was just adopted by her step dad. My step dad's brother. I asked him if he would adopt me and he told me no he didn't want to. I can remember exactly what we was eating for dinner and how I was trying to hold back my tears and still choke down the food. pork chops, peas and mashed potatoes. 😞", "l": 509, "r": 8, "c": ["Other"]}, {"n": 48, "t": "Oh I have many. “You need therapy.” “You’re too sensitive.” “You’re too emotional.” “It happened years ago you should just let it go.” And I could go on but 🤷‍♀️", "l": 487, "r": 6, "c": ["🧠 Mindset & mental health"]}, {"n": 49, "t": "My Dad: “I married your mother, not you. She will always come first.” (I knew he disliked me, this gutted me tho. Who says this to your child.)", "l": 480, "r": 9, "c": ["💍 Relationships"]}, {"n": 50, "t": "I dont hold on to anger. No one is worth that energy", "l": 453, "r": 12, "c": ["Other"]}, {"n": 51, "t": "Giving virtual hugs to everyone in this comment section because damn family can be so cruel", "l": 414, "r": 0, "c": ["Other"]}, {"n": 52, "t": "Not so much what they said but what they did… 5 sisters and not one of them comforted me when I lost my son…. I begged them.. we went from being inseparable to I don’t care about them", "l": 408, "r": 2, "c": ["Other"]}, {"n": 53, "t": "My biological mom said that when she was pregnant with me if abortions would’ve been legal, she would’ve had one. Another time my brother passed away in 2020 and she kept telling people that her only child passed away.", "l": 403, "r": 8, "c": ["Other"]}, {"n": 54, "t": "I apparently owe my mom my life because she decided to have me", "l": 394, "r": 1, "c": ["Other"]}, {"n": 55, "t": "\"I hope you get your life together \" I have 3 bachelor's degrees, two master's, and working on my second post grad ....Their DAUGHTERS just got married and had kids, I think one worked", "l": 394, "r": 0, "c": ["💍 Relationships"]}, {"n": 56, "t": "After my Mom died (I was 24) suddenly, her 2 sisters came to my house about a month later and demanded the China that their mother left to my mom. Because I wasn’t really her child because I’m adopted.", "l": 379, "r": 7, "c": ["Other"]}, {"n": 57, "t": "My sister told me that I was responsible for my son’s terminal cancer because our religious beliefs don’t match. She said his cancer was because I had turned my back on god.", "l": 366, "r": 3, "c": ["Other"]}, {"n": 58, "t": "my mom used to tell me she wishes she had aborted me. me too mom me too. but shes ☠️now. I hope shes looking up at me and seeing how well im doing with my kids & they love me & I love them and raised them the way I wish I had been raised.", "l": 360, "r": 7, "c": ["Other"]}, {"n": 59, "t": "My husband adopted my oldest daughter when she was 2 and we hadn’t told her yet. His sister told her when she was 6 out of pure hatred. I asked my husband to talk to his sister after I was up all night with aheart broken kiddo. I just couldn’t understand how one could deliberately hurt a child with no remorse. He told me he didn’t want to rock the boat with his family. I realized in that moment it was me and her not me him and her. It still brings tears to my eyes. I haven’t looked at him the same since which is sad bc he really is an amazing man but I can’t get over it. She was 6!", "l": 301, "r": 3, "c": ["💍 Relationships"]}, {"n": 60, "t": "After I gave birth to twins and went home empty handed, my mom told me to stop grieving already a month later and then when I called her out for it she said, “oh hun I didn’t realize it was that serious” but it was serious enough for her to drive cross country to “be there for me”", "l": 292, "r": 2, "c": ["Other"]}, {"n": 61, "t": "My heart breaks for every single person who has seriously posted here. If I had only one wish, it would be that none of this had ever happened to you. And to those that have made jokes, please please please delete them.", "l": 237, "r": 5, "c": ["Other"]}, {"n": 62, "t": "It might sound stupid but it was my parents' anniversary. I drew something for them that took 4 hours and I was really proud of it. When I showed it to my dad, he kept complaining about why he looked weird in the drawing, even saying \"I don't like it lah, why don't you make something like your brother\" and he kept praising my brother about the cake he made.", "l": 232, "r": 7, "c": ["Other"]}, {"n": 63, "t": "When I was five my mother bought me the scarecrow doll from The wizard of Oz because she said I didn't have a brain.😔 I'm almost 40 and I really don't pay for Christmas because of those memories", "l": 223, "r": 1, "c": ["❓ Questions"]}, {"n": 64, "t": "When I was a child they said I’d never be anyone important. I once said “watch me I’ll graduate hs and college and university!” Because they didn’t. They started laughing “yeah right” “you won’t go nowhere” and when you move out we’ll throw a party here. Not for you but for us to celebrate you being gone. I said “watch I will be someone important” I graduated hs 2 years early. I’m graduating college in may and university in aug. they don’t say anything anymore.", "l": 222, "r": 4, "c": ["💼 Career & money", "❓ Questions"]}, {"n": 65, "t": "my mother called me a whore when i was 13 for having red lipstick on. i wasn’t even segually active 😭😭😭", "l": 220, "r": 6, "c": ["Other"]}, {"n": 66, "t": "“The phone goes both ways” made me blame myself for our lack of connection. It isn’t the child’s role to feel safe and loved", "l": 212, "r": 1, "c": ["Other"]}, {"n": 67, "t": "My mother recently said that I am the daughter she never wanted and she is the mother I never wanted!! I am 55 and that hurt", "l": 185, "r": 6, "c": ["Other"]}, {"n": 68, "t": "My brother would tell people I was his mother's daughter he wouldn't claim me as his sister. He was my favorite person when I was little. He has told me to my face I amounted to nothing. It's hard to have a sibling that hates you.", "l": 169, "r": 4, "c": ["Other"]}, {"n": 69, "t": "I was adopted at birth.. I was very close with my dad and his side of the family. My dad died when I was 25. I stopped getting invited to family functions. My cousin told me I “wasn’t a real cousin”", "l": 160, "r": 4, "c": ["Other"]}, {"n": 70, "t": "I was 39 & had just been diagnosed with cancer. While going through chemo my mother, who I had been no contact for 4 yrs, left a card on my porch. All it said was “if I would grow up and be an adult she could be there to take care of me”, I didn’t need or want her help", "l": 160, "r": 1, "c": ["Other"]}, {"n": 71, "t": "just when I started to feel happy again recovering from depression my mom and dad told me to stop being so damm happy and that I'm still a failure at life a black sheep to the family and that I'll never ever amount to what my older brother is", "l": 158, "r": 3, "c": ["🧠 Mindset & mental health"]}, {"n": 72, "t": "my now husband overheard some of my family bad mouthing him at a family holiday one year. that was about 3 years ago, he didnt tell me untill after we were married, I will never trust them again because sure he may not be a doctor and I may of moved states to be with him but I chose to move, I said yes knowing he's not a doctor, I would chose him every time. he is the sweetest and kindest man with the biggest heart with alot of humor mixed in even after everything that has happened to him. he is the best choice I have ever made.", "l": 155, "r": 1, "c": ["💍 Relationships"]}, {"n": 73, "t": "When my mother said “it’s not like I’m hurting anything” as she continued to manhandle my husband’s pillow after being told to stop. He’d literally died not three days before and he HATED anyone touching the bed, especially his pillow. Yes, she knew this. She’s also known for her love of heavily scented perfumes and lotions.", "l": 150, "r": 2, "c": ["💍 Relationships", "❓ Questions"]}, {"n": 74, "t": "That my son struggles with reading and writing because I’m too lazy to work with him and that “He’ll be lucky if he works in a factory someday, and that’s okay.” He was later diagnosed with with adhd and dyslexia, has the right supports, and is doing much better…and factory workers are very much needed.", "l": 138, "r": 1, "c": ["Other"]}, {"n": 75, "t": "My daughter telling my MIL she wanted a barbie dreamhouse for Christmas and her response being that she doesn't have her own bedroom and our house was too small in front of other family members. We are doing the best we (me and my hubby) can and working really hard. It still makes me cry to think about it.", "l": 135, "r": 3, "c": ["Other"]}, {"n": 76, "t": "When I was going through cancer at 43 and would call my dad for support…he picked up the phone and said ‘I’m dreading your calls lately because it’s depressing’… never spoke to him since.", "l": 124, "r": 2, "c": ["🧠 Mindset & mental health", "❓ Questions"]}, {"n": 77, "t": "A friend of mine took his life his senior year of hs. The way it made my friends around me feel hurt so bad. I remember one night after being with everyone, not having slept for a day or 2, I finally came home and everything kind of fell apart. I started talking to my mom, who’s my only parent, and honestly I started crying. I don’t cry much. I told her this situation made me feel a certain way about being alive anymore, and she laughed at me. And since that day, my mom and I have never, and will never see eachother the same again. I’ll never be able to forgive that.", "l": 116, "r": 0, "c": ["Other"]}, {"n": 78, "t": "Recovering after a traumatic birth with my second child and my husband introduced our younger son to his new sibling without me. I was so hurt to be excluded from that moment", "l": 115, "r": 11, "c": ["💍 Relationships"]}, {"n": 79, "t": "“you make me happy my mother (my grandmother) is dead so she didn’t have to see the kind of person you grew up to be” my nana was my favorite person in the whole world and died when i was 9 from cancer :/", "l": 94, "r": 4, "c": ["Other"]}, {"n": 80, "t": "I was told I was being selfish for continuing my pregnancy with my son because he has spina bifida. That it wasn’t too late to terminate (I was 26 weeks when we found out he had SB). That I signed him up for a life of pain with no quality. He’s 3 now and thriving. No pain, just a typical kid that happens to use a wheelchair. I’m so glad I had done my research and knew what they were saying wasn’t true, but I still think about it often.", "l": 94, "r": 2, "c": ["Other"]}, {"n": 81, "t": "Growing up we had a family friend that knew my mom since a child. I grew up calling her my grandma. I loved her so much. Her daughters I knew as my aunts. It didn’t click to me that we weren’t blood because it didn’t matter to me as a child, that woman was my grandma. Well when I was 12 I believe she passed from cancer, and it was time for her funeral. They had all of her grandkids sit in the front. So of course I made my way to the front to sit with the rest of the grandkids. This lady from her more distant family tapped my shoulder and asked what I was doing. I said I was sitting with my “cousins” and she looked at me and said only the grandkids were sitting there, and I said I was her grandkid, and she said no only her real grandkids. It broke my heart. All my life I knew her as my grandma and we were so close. Then it clicked to me that we aren’t blood related. She made me go sit in the back. I remember just looking around at all the people I called my family, at my “cousins” my “aunts” and I wondered if they didn’t see me the same way I saw them. From that time on I stopped going over to their houses, I stopped asking to call them or go to events with them. I stopped almost all contact. Now as an adult I’ve spoken the the woman I called my aunt and she said she had no idea why the woman said that to me, that she wishes I would’ve come to them sooner and told them what the woman said because they loved me so much and didn’t understand why I didn’t want to be around anymore. Maybe it sounds dramatic to yall but to me it broke my heart, not that I just couldn’t sit in front, just that being told I wasn’t family after spending my whole life with them knowing them only as my family, then being told I wasn’t really one of them.", "l": 87, "r": 3, "c": ["Other"]}, {"n": 82, "t": "i was 16 when my mom passed away to a cardiac arrest. the night before she had a cardiac arrest she had a seizure which wasn’t normal for her. i was home alone and freaked out really badly to where i hesitated calling 911 and my neighbors came rushing because they heard me having a full blown anxiety attack. she ended up being okay that night. i offered to call the ambulance, but she stopped me and told me not to. this was nearly 4 years ago. about a year ago, i was sick with the flu and my aunt (moms sister) called to “check on me” next thing you know she was basically pointing fingers at me and telling me to make sure i go to the doctor and not make the same “lousy” mistake as i did with my mom.", "l": 87, "r": 2, "c": ["🧠 Mindset & mental health"]}, {"n": 83, "t": "When I was ~12, while we were cleaning paint brushes, my dad said, \"The guys at work say someday you'll resent me working you like a slave [for my apartment rental business].\" Then he laughed and said, \"no you won't\". Our relationship was never the same, bc I realized I was being used. I started getting jobs that paid. Still thankful for the unmatched work ethic I learned though.", "l": 87, "r": 6, "c": ["💼 Career & money", "❓ Questions"]}, {"n": 84, "t": "if I dont forgive , it hurts me not them.", "l": 85, "r": 18, "c": ["Other"]}, {"n": 85, "t": "I asked my mom to help and come down to babysit her grandbaby for me for two weeks in order to find a good daycare while I start a bew job, she didn’t come. 6 months later she went to help my brothers best friends wife with her baby for three weeks while she was approved to work from home! I have been no contact for three months now she never does anything for means never congratulations me for my accomplishments", "l": 81, "r": 0, "c": ["💍 Relationships", "💼 Career & money"]}, {"n": 86, "t": "When I wanted some help to go to rehab and was homeless my dad told my mom to leave me on the side of the road because I was dirty and who cares she’s going to die anyways. They never helped me once. I pulled through now I’m a thriving SAHM to 2 kids. I just needed help not hate", "l": 79, "r": 1, "c": ["❓ Questions"]}, {"n": 87, "t": "Every time I say what my parents told me on this app I get a strike. It’s that bad.", "l": 76, "r": 7, "c": ["Other"]}, {"n": 88, "t": "it sounds stupid now that im reading the comments but my dad's cousin in a function once told me \"woah, you look a lot like your dad when he was younger, but dont worry he grew into the most handsome man in town\" like you just called me ugly 😭", "l": 73, "r": 4, "c": ["Other"]}, {"n": 89, "t": "My brother told me that my mother would still be alive if it wasn't for me. Never mind the fact that she had Lewy-Body dementia and passed away in a nursing home. Haven't spoken to him since.", "l": 72, "r": 0, "c": ["Other"]}, {"n": 90, "t": "It’s what they haven’t said. It’s that they dont even care about you enough to fight to have you in their life.", "l": 66, "r": 0, "c": ["Other"]}, {"n": 91, "t": "I was about 20, I was mostly a good kid, stayed home to take care of my family when I wasn't in school, didn't really have a social life outside of school/college walls except online. My stepdad said he wouldn't care \"if I sprayed my brains all over the wall\" and yes that is word for word what he said and no he has not properly apologized, I'm 32", "l": 58, "r": 0, "c": ["💼 Career & money"]}, {"n": 92, "t": "My moms only living brother didn’t show up to my wedding (found out on the day of). I saw him 3 years later at my cousins graduation where he met my daughter for the first time. The first sentence he said to me was, “you guys need to watch what you’re eating. You’re getting so big” as someone who is struggling with PCOS and postpartum didn’t help 🥲", "l": 57, "r": 0, "c": ["Other"]}, {"n": 93, "t": "“Go find your real family”… I’m adopted.", "l": 53, "r": 1, "c": ["Other"]}, {"n": 94, "t": "My mother told me she wished I was never born", "l": 53, "r": 4, "c": ["Other"]}, {"n": 95, "t": "I was told “you were a mistake.” This came from my mother", "l": 52, "r": 4, "c": ["Other"]}, {"n": 96, "t": "I went through premature menopause at 27. Devastated that I couldn’t have children. My sister was mad at me and screamed, “you never should have kids anyways”……. (she has bad temper outbursts), but I’ll never heal from this. I don’t even think she knows how much it crushed me and still to this day, hurts.", "l": 51, "r": 2, "c": ["Other"]}, {"n": 97, "t": "My father left my mother sister and me when I was 5. I didn’t hear a peep from him till my 20s. Every once in a while we’d connect. But he was usually drunk so he had little memory of our conversations or time together. He had a second wife. And 4 other kids. When he passed. I was in my 50s. I was trying to figure out how to get to the funeral. A sister of mine that was from his second family told me I wasn’t welcome at the funeral. He had told her he didn’t want me there. Because “I wasn’t there for him in life. He didn’t want me at his funeral “. I haven’t spoken to her or most everyone else from his side of the family since. 8 years ago.", "l": 44, "r": 1, "c": ["💍 Relationships"]}, {"n": 98, "t": "My dad told me I didn't deserve the life I have and my sister should have my life. We are one year no contact and I'll never go back.", "l": 42, "r": 0, "c": ["Other"]}, {"n": 99, "t": "My mum once said “we failed at raising you” when I was working, studying, cooking and cleaning for everyone, and I still think of it almost everyday. It makes me feel like I constantly need to be better and since then I’ve never been the same mentally idk if it’s for the better or worse.", "l": 41, "r": 2, "c": ["Other"]}, {"n": 100, "t": "My mother was in the hospital and I called for a quick update to see what was going on and my sister got on the phone and said she’s dead. That’s how she told me my mother had passed away. I hung up the phone because I was at work and when I got to the hospital, my family informed me that my sister walked into the room and said be prepared because someone is going to be dramatic… that someone being me… there’s a much better way to tell someone your loved one has passed away…", "l": 41, "r": 0, "c": ["Other"]}, {"n": 101, "t": "My grandma and her harsh dementia words, I know it’s not her but it’s so hard not to think that", "l": 38, "r": 0, "c": ["Other"]}, {"n": 102, "t": "I was called a bad Christian when I got divorced 😞", "l": 38, "r": 3, "c": ["💍 Relationships"]}, {"n": 103, "t": "My sister when I came home from the hospital with my newborn son. First thing she said how did you have a lightskin child? Excuse me 😳", "l": 37, "r": 2, "c": ["Other"]}, {"n": 104, "t": "I graduated college and my mother said I wasted my time", "l": 36, "r": 0, "c": ["💼 Career & money"]}, {"n": 105, "t": "“You know your mother could have had an abortion”…I was put up for adoption and adopted by a wo e who I was caring for or under what condition, they just believed I had to do it, and they’d never take accountability or or ownership of their care.", "l": 17, "r": 0, "c": ["Other"]}, {"n": 122, "t": "He said well you killed your baby.. - My husband to me after I miscarried our baby and was completely devastated and healing.. 💔", "l": 17, "r": 0, "c": ["🧠 Mindset & mental health", "💍 Relationships"]}, {"n": 123, "t": "when I was told often by my mom, you're nothing like me, and it was always said with disgust, You know I'm glad I'm not", "l": 17, "r": 0, "c": ["❓ Questions"]}, {"n": 124, "t": "my aunty called my cat ugly", "l": 17, "r": 3, "c": ["Other"]}, {"n": 125, "t": "When my family thought I'd be an addict like my dad and they were surprised when I graduated high school. Loved my dad with every fiber of my being. Through his demons I still seen the good. I'm not an addict. Graduated High school, College, Married, 3 kids and a 3x homeowner with stability. Needless to say my kids don't know these family members and I make it my priority to shield them from them as well.", "l": 16, "r": 0, "c": ["💍 Relationships", "💼 Career & money", "❓ Questions"]}, {"n": 126, "t": "My stepdad was always pointing fingers at me for everything wrong in this family. My mom always supported her husband wants and needs so there’s that", "l": 16, "r": 2, "c": ["💍 Relationships"]}, {"n": 127, "t": "My mother was shot in a home robbery when I was very young. Told a relative “why should she have a life when I don’t?” Relative of course told me. Called me a wh—e on multiple occasions. There’s so many. She’s gone now.", "l": 16, "r": 0, "c": ["Other"]}, {"n": 128, "t": "My aunt asked why I was getting Forbes magazines, I said I might want to start my own business one day she say NO and said she doesn’t have Forbes magazine and she had a degree behind her name. She then told me Rolling Stones is for someone like me.", "l": 16, "r": 0, "c": ["💼 Career & money"]}, {"n": 129, "t": "My mom telling me she wished I was the one dying not someone else. That will never leave me.", "l": 16, "r": 0, "c": ["Other"]}, {"n": 130, "t": "Before he died my father told me I wasn’t his biological daughter because my mother had cheated with BOTH of his brother’s. But from the second he held me in his arms, I was his daughter. He loved me so much, I know he didn’t want my mother to ever hurt me with this info.", "l": 15, "r": 1, "c": ["Other"]}, {"n": 131, "t": "The day after our wedding, my stepdaughter looked her dad in the eye and said she didn’t know why he married me and that he could do better. Yes, I was sitting right beside him. In a crowded restaurant. Good times!", "l": 14, "r": 0, "c": ["💍 Relationships"]}, {"n": 132, "t": "All “their last name” have blue eyes!! Both of mine had brown eyes and popped off that brown eyes were dominant against blue eyes!!!", "l": 14, "r": 0, "c": ["Other"]}, {"n": 133, "t": "My mother called my entire family (cousins, aunts, uncles, siblings) and told them I was not talking to her and that they should not talk to me because I need to know what it’s like to have no one!", "l": 13, "r": 2, "c": ["Other"]}, {"n": 134, "t": "my mom told me I had so much blubber on me that I didnt know what it was like to be as cold ask skinny people like her. you dont tell that to a child", "l": 13, "r": 0, "c": ["Other"]}, {"n": 135, "t": "A (friend) said to me when my dad had a brain aneurism, well no wonder he drinks . He passed away 12/25/88 never spoke to her again after she said that . Been 37 yrs.", "l": 13, "r": 0, "c": ["Other"]}, {"n": 136, "t": "After my grandmas funeral my two Aunts pulled me aside to let me know they placed mg dads ashes in with her. They smiled and giggled about it (guess it’s not legal). Funeral staff knew. Still haven’t fully processed it.", "l": 13, "r": 0, "c": ["Other"]}, {"n": 137, "t": "When I graduated college a family member said, “ I didn’t think you were smart enough to do that.”", "l": 12, "r": 0, "c": [" king, “You STILL Single?”", "l": 6, "r": 1, "c": ["Other"]}, {"n": 169, "t": "My mother told me, on multiple occasions that she only cared for and was worried about my younger brother when she left us. She wasnt bothered about me at all", "l": 6, "r": 0, "c": ["Other"]}, {"n": 170, "t": "“You could have been… more”", "l": 6, "r": 0, "c": ["Other"]}, {"n": 171, "t": "I was r*ped by my grandmothers bf, when he died in prison, my grandma looked at me in my eyes, then back to my mother and said “I’m going to his funeral because he didn’t do anything to me” then when my mother unalived herself, same grandma came to see me at the hospital after having my first child. Stayed for all of three minutes then started crying and said “I have to leave, without your mother to be here for me, it’s just too hard” also when my mom unalived herself, they still had her body in the house, that I found, child services came and asked where I was going and my entire family said things like “I didn’t ask for this” or “it’s not my fault/problem”..they all had extra unused rooms in their homes and lived in the same area as me.", "l": 6, "r": 0, "c": ["Other"]}, {"n": 172, "t": "I wasn’t a well behaved child, i get it. I got adopted when I was barely 9 months. At the age of 9 my mother said “I wish I would’ve given you back” and the whole idea of family fell apart for me that day. I’m 25 now, and I think of it every day.", "l": 6, "r": 0, "c": ["Other"]}, {"n": 173, "t": "When I was 9 I got lost during Halloween trick or treating because I started following another family with a kid dressed the same as my older sister. I don’t know how long I was lost for. I just remember being with this family and my dad yelling my name down the street and the other family calling out to him to tell him where I was. When my dad and I got back with my family, my aunt looked at me and said “Thanks for ruining everyone’s Halloween”", "l": 6, "r": 0, "c": ["❓ Questions"]}, {"n": 174, "t": "My mother told me that my brothers child will always be her favourite.", "l": 6, "r": 1, "c": ["Other"]}, {"n": 175, "t": "In HS I was in drama and got a big-ish role in a one act play. I worked really hard and was so excited for my mom to come watch me(she came to every single one of my brothers shows) and it was only a one night performance. She didn’t come. When I got home, she was drunk, and when I asked her why she didn’t make it she said “I couldn’t sit in the crowd next to all the parents who were proud of their kids and pretend I was proud of you”", "l": 6, "r": 0, "c": ["Other"]}, {"n": 176, "t": "My mom saw me getting dressed one day and saw i had cellulite on my thighs and gasped and said “im 40 and i don’t even have cellulite” i was 12. Another time at 18 i had gained 20 pounds and she told me i was starting to look like a “senora” (old woman) body and that i had a “senora body”. I was only 170.", "l": 6, "r": 1, "c": ["🏋️ Weight loss"]}, {"n": 177, "t": "i grew up in small town with no fast food or takeaway options so my food had always been homecooked and healthy. when i went away to boarding school i went a little crazy without adult constant supervision and gained some weight. when i came home after my first year, i was at the pool getting sunscreen rubbed onto my back by my mum and she said \"you have bigger love handles than i do\" in front of the whole town. i had to go home and look up what love handles were. before that day, i didn't know what it felt like to be self conscious or insecure in myself. i was 12 years old", "l": 5, "r": 0, "c": ["🍽️ Eating habits"]}, {"n": 178, "t": "I had two 20 week miscarriages and my mom was barely there for me. She kept saying stuff like “at least you already have kids” “at least youre not gonna have a handicap kid” “at least you can try again” anything starting with “at least” shouldnt be said probably", "l": 5, "r": 0, "c": ["Other"]}, {"n": 179, "t": "Mom I’m not going to college right away I want to work first, “great another disappointment”", "l": 5, "r": 0, "c": ["💼 Career & money"]}, {"n": 180, "t": "My mother said to me as a senior in high-school, \" I've always known you weren't smart enough for college, so didn't bother saving any money for you\". l believed her, how different my life would be if I hadn't.", "l": 5, "r": 0, "c": ["💼 Career & money"]}, {"n": 181, "t": "my grandpa said i was stupid to my friends when my teachers praised me for how smart i am. i flunked my final because i don't have the motivation to do better. i know that i was smart, but i let people's words get into my head.", "l": 5, "r": 0, "c": ["Other"]}, {"n": 182, "t": "My uncle died in a house fire when I was 8, he was the only family member that encouraged me to just be myself. My older cousin told me to stop crying and that I wasn’t allowed to be sad because he was their uncle and not mine. That I wasn’t a real family member because I’m adopted. My aunts agreed and my mom didn’t believe me when I told her. She always took their side. I’m 34 now and it still hurts.", "l": 5, "r": 0, "c": ["Other"]}, {"n": 183, "t": "when my dad told my husband im a spiteful b and he hoped my husband would see me for who I am and leave me.", "l": 5, "r": 0, "c": ["💍 Relationships", "❓ Questions"]}, {"n": 184, "t": "That my abusive ex was still part of the family. And I couldn’t just expect THEM yes all my brothers and sisters to just get him out of their lives. That’s a hard pass for me and they witnessed the abuse and still said that to me.", "l": 5, "r": 0, "c": ["Other"]}, {"n": 185, "t": "My dad said that Trump is the best president ever. WTF?!", "l": 5, "r": 0, "c": ["Other"]}, {"n": 186, "t": "Father God, please cover every last one of your children in these comments who have been hurt by these unforgettable statements. Please bring them healing, peace, and the strength to move forward with their lives and not be weighed down by the pain and trauma those statements have given them. Let them know they are loved and that you are with them in every step. In Jesus mighty name I pray, AMEN.", "l": 5, "r": 0, "c": ["🧠 Mindset & mental health"]}, {"n": 187, "t": "\"I don't regret voting for him.\" After I explained how I would have died in Texas with the kind of miscarriage I had after Roe v. Wade was overturned.", "l": 5, "r": 0, "c": ["Other"]}, {"n": 188, "t": "A lot actually. Hold on…", "l": 4, "r": 0, "c": ["Other"]}, {"n": 189, "t": "\"am I not supposed to have a life?\" \"yes\"", "l": 4, "r": 0, "c": ["Other"]}, {"n": 190, "t": "Reading the comments. We all deserve to be happy 😭", "l": 4, "r": 0, "c": ["Other"]}, {"n": 191, "t": "“It should’ve been you” after my father died in front of me I might add.", "l": 4, "r": 1, "c": ["Other"]}, {"n": 192, "t": "“All you do is stress me out, I don’t need that stress in my life”", "l": 4, "r": 0, "c": ["Other"]}, {"n": 193, "t": "\"I like Tr*mp. he's a funny guy.\" No dad.. no.", "l": 4, "r": 0, "c": ["Other"]}, {"n": 194, "t": "my mum telling my father that it's my birthday. his response was: i don't care. (e and?) i was 4 years old and i heard that conversation via phone.", "l": 4, "r": 0, "c": ["Other"]}, {"n": 195, "t": "“Why did you get a bad grade, and what did others get?”", "l": 4, "r": 0, "c": ["Other"]}, {"n": 196, "t": "\"You'll make a great wife someday\" My dear Taid who passed away 💜", "l": 4, "r": 0, "c": ["💍 Relationships"]}, {"n": 197, "t": "My aunt told me to get over my mom’s death and I was 16.. I’ve never talked to her since", "l": 4, "r": 0, "c": ["Other"]}, {"n": 198, "t": "Wasn’t said to me but my dad was adopted and he told my uncle after I was born that he doesn’t think he’ll ever be able to love me because he was adopted. That wasn’t my fault. I was just a baby.", "l": 4, "r": 0, "c": ["Other"]}, {"n": 199, "t": "My granddad said he’s afraid of me and my parents because we don’t fear god. We believe in god, but we don’t go to church that often. He’s said we shouldn’t walk the street without shame and that we burn in ents again. I got to a place where I was finally ready to ask for help and run away and I told my father what I had been through, and warned him to be careful because I wasn't sure how dangerous my husband was (gang affiliated). My father asked me, \"So then why did you come back?\" I tried to get over it a few times but, I never really could. I have been no contact with him over a year now.", "l": 4, "r": 0, "c": ["💍 Relationships"]}, {"n": 208, "t": "My dad told my mom I wasn't his daughter when I was 13 now at 42 I no longer am. Haven't seen him in a decade. I know he just wrote it off but it stuck with me.", "l": 4, "r": 0, "c": ["Other"]}, {"n": 209, "t": "an aunt said my sister was \"called to heaven\" bc god knew she had nothing left on earth bc she was bi-polar. she had 2 toddlers at the time.", "l": 4, "r": 1, "c": ["Other"]}, {"n": 210, "t": "My mom told me they hadn’t planned on children and my dad was disappointed I wasn’t a boy.", "l": 4, "r": 0, "c": ["Other"]}, {"n": 211, "t": "The Christmas before I left for bootcamp, my aunt tells me that I’ve ruined the holidays as they’ll never be the same again. She was right. That was 22 years ago and I never went back.", "l": 4, "r": 0, "c": ["Other"]}, {"n": 212, "t": "When my dad passed, my grandpa said “it’s probably for the better”", "l": 4, "r": 0, "c": ["❓ Questions"]}, {"n": 213, "t": "Not what the said what they did. I watched my mother get treated so so horribly by them my whole life. She passed when I was 14, I was kicked out my 16th bday and I never looked back. Most of my family hasn’t heard a word from me since. It stops here, my mother lived miserably. I will not let them do to me what they did to her.", "l": 4, "r": 0, "c": ["Other"]}, {"n": 214, "t": "[in a family therapy appt, after being asked to apologize for putting my son in danger] \"get over it\". it led to no contact.", "l": 4, "r": 0, "c": ["🧠 Mindset & mental health"]}, {"n": 215, "t": "Was 9 mo pregnant and about to give birth any day w. Not forgiving them is like bleeding out from my wound.", "l": 3, "r": 3, "c": ["Other"]}, {"n": 226, "t": "\"son who are u choosing? mom or dad?\"", "l": 3, "r": 1, "c": ["Other"]}, {"n": 227, "t": "when i asked my mum if she thought my step dad would be happy if i asked him to adopt me and she loomed at me with disgust and said y would he want to adopt you i said ok never asked him😅", "l": 3, "r": 0, "c": ["❓ Questions"]}, {"n": 228, "t": "My mom fully looked at me and said, “if anybody were to ever get drafted, I would prefer that you did over your brother” oh-? 🤨", "l": 3, "r": 0, "c": ["Other"]}, {"n": 229, "t": "I don’t know how to fix us", "l": 3, "r": 0, "c": ["Other"]}, {"n": 230, "t": "My niece told me she wished I died instead of her mom…", "l": 3, "r": 0, "c": ["Other"]}, {"n": 231, "t": "i have an older sibling. I made my mother very angry one day and she told me that \"maybe we should have stopped at the first\". I was too stunned for it to hurt.", "l": 3, "r": 0, "c": ["Other"]}, {"n": 232, "t": "My uncle made fun of my weight my entire childhood and I’m except to act like nothing ever happened and be okay with him.", "l": 3, "r": 0, "c": ["Other"]}, {"n": 233, "t": "when I was pregnant my mother told me she didn't like me dating outside my race (I'm white & my x is Hispanic) but you can't help who your kids fall in love with", "l": 3, "r": 0, "c": ["💍 Relationships", "❓ Questions"]}, {"n": 234, "t": "I d rather not say", "l": 3, "r": 0, "c": ["Other"]}, {"n": 235, "t": "‘Take it back! I don’t want it!’ When I was born.", "l": 3, "r": 0, "c": ["Other"]}, {"n": 236, "t": "oh i thought u were someone important - my cousins husband at their wedding. i thought he was joking but deep down maybe he wasnt. didnt want to cause a scene so i said nothing", "l": 3, "r": 0, "c": ["💍 Relationships"]}, {"n": 237, "t": "When I was planning my father’s funeral entirely on my own while recovering from spine surgery because my mom was useless in her grief, I made a mistake in his obituary which my older sister (he was married before and had 3 kids) pointed it out and I snapped. She made no attempt to help with anything and I was overwhelmed. She replied with “Well you and your mother may not like that he had a life and a family before you came along but myself and my siblings who were here first, do.”", "l": 3, "r": 0, "c": ["💍 Relationships", "❓ Questions"]}, {"n": 238, "t": "It’ll be hard to forgive my ex for dragging the divorce along", "l": 3, "r": 0, "c": ["💍 Relationships"]}, {"n": 239, "t": "No matter what was said I will forgive them, since it helps me and them, and I will also set healthy boundaries to protect my family.", "l": 3, "r": 0, "c": ["Other"]}, {"n": 240, "t": "suicides dont go to heaven after my brother took his own life", "l": 3, "r": 1, "c": ["Other"]}, {"n": 241, "t": "« Just because i do it doesn’t mean that you should » she was scolding me and idk why but it just stuck with me.", "l": 2, "r": 1, "c": ["Other"]}, {"n": 242, "t": "I am adopted. My brother said to us “mom and dad never even asked us if it was okay to adopt you guys” basically his way of saying he wished we weren’t apart of the family and to this day we still feel this and they dont go out of their way to communicate with us or support us.", "l": 2, "r": 1, "c": ["Other"]}, {"n": 243, "t": "No more PlayStation😞", "l": 2, "r": 0, "c": ["Other"]}, {"n": 244, "t": "Stop grieving your brother and be strong for your mom", "l": 2, "r": 0, "c": ["Other"]}, {"n": 245, "t": "my mother in law told me I wasn't family.... cool.", "l": 2, "r": 0, "c": ["Other"]}, {"n": 246, "t": "My mother abandoned when I was 12. She wanted me to go live with my father. He didn't want me either. After I hung up the phone, she said to me, I guess you'll have to stay now. I'm 47, I think about it every day of my life.", "l": 2, "r": 1, "c": ["Other"]}, {"n": 247, "t": "“seventy times seven” if we don’t forgive others god won’t forgive us 🙏", "l": 2, "r": 6, "c": ["Other der and provide not just for myself but my mom and sister 😚", "l": 2, "r": 0, "c": ["Other"]}, {"n": 257, "t": "life is all about perspective 😏", "l": 2, "r": 0, "c": ["Other"]}, {"n": 258, "t": "They want me to die alone in a hospital bed. Don't have the courage to tell you who said it.But it hurts.", "l": 2, "r": 2, "c": ["Other"]}, {"n": 259, "t": "One of my siblings said to me when her 4 year old son died…..it should have been your son that died…because she said she did everything right in life.", "l": 2, "r": 3, "c": ["Other"]}, {"n": 260, "t": "My sister in law said that the next time I try to kms she hopes I’m successful.", "l": 2, "r": 0, "c": ["Other"]}, {"n": 261, "t": "I don't let what people say to me that's not beneficial carry weigh in my life. I can't think of anything. I don't play about words anymore. Be careful who you hold in high esteem in your life because you give them the power to break you. We can honor those we love without putting them on pedestals. Guard your heart. Forgive for you.", "l": 2, "r": 0, "c": ["Other"]}, {"n": 262, "t": "I asked my step grandfather who was raising me with my grandmother if he loved", "l": 1, "r": 1, "c": ["Other"]}, {"n": 263, "t": "my mom was going to give our family heirloom to my cousin, when it should have gone to me. Not out of grees, it was last in my father's possession and it was always intended for me. When I made my case and finally got the family on my side, my mom relented by stating \"Yeah, you're family too, I GUESS.\" It still echoes in my head on quiet nights, years later. Why didn't she ever like me as much as my siblings?", "l": 1, "r": 1, "c": ["❓ Questions"]}, {"n": 264, "t": "that they don't like me because i remind them of my biological father my biological father was a really bad man who did un speakable things to children", "l": 1, "r": 1, "c": ["Other"]}, {"n": 265, "t": "My sister got pregnant \"I thought it would be you not her\" said my mum. My dad looked at me not long after she ha ry that happened to you", "l": 5}, {"p": 28, "t": "They feel disappointed bc you are what they could never be 🫶🏻 they do see themselves in you but the version they never had the strength or courage to become", "l": 4}, {"p": 28, "t": "Horrible. I so sorry.", "l": 1}, {"p": 28, "t": "that's so sad😭💔", "l": 1}, {"p": 28, "t": "Don’t hold grudges bro it’s not worth it you should try to talk to him he may have regretted saying it 🙏", "l": 0}, {"p": 28, "t": "It's okay to feel the same way about him but feel differently about yourself. 💜", "l": 0}, {"p": 28, "t": "I never looked at it that way. I appreciate you.", "l": 0}, {"p": 28, "t": "😢I am so truly sorry.", "l": 0}, {"p": 28, "t": "right before my graduation my dad told me I had to move out.", "l": 0}, {"p": 29, "t": "oh bae..", "l": 10}, {"p": 29, "t": "", "l": 4}, {"p": 29, "t": "“You’re lying, he would never say that” even though he was the one that told her on the phone. I guess she didn’t think I was paying attention to her conversation that she had on speaker while we were in the same car. She said I was overreacting.", "l": 2}, {"p": 29, "t": "And of course she didn’t believe me when I said he eventually did something", "l": 1}, {"p": 29, "t": "poor baby 🥹", "l": 1}, {"p": 29, "t": "This 🥹", "l": 1}, {"p": 29, "t": "🥺", "l": 1}, {"p": 29, "t": "@Laweezahhh", "l": 0}, {"p": 30, "t": "that's horrible my heart breaks for you 💔", "l": 67}, {"p": 30, "t": "🤣😭", "l": 3}, {"p": 30, "t": "😁😁😁", "l": 2}, {"p": 31, "t": "im sorry your mother said that to you, she can't claim to be a Christian or to know God or have a relationship with Christ if she is saying hurtful things like that. there is no action that can save you eternally other than believing in what Jesus did for all of us.l, and the works (going to church to worship and serving others) will naturally follow. I hope her misconduct and hypocrisy doesn't skew your view of God", "l": 2}, {"p": 31, "t": "as a christian, this genuinely makes me so sad. i understand n that omg 😭 I'm so sorry.. I hope you do heal 🙏🏽", "l": 0}, {"p": 32, "t": "I was 5. I still remember every day.❤️‍🩹", "l": 0}, {"p": 32, "t": "nope. Just finished her end Hospice for 2.5 years. soul crushing but I did what was necessary. There was some peace to myself that I was able to do that. Soul crushed still. I kind of got a peaceful mind about it. I was not the problem.", "l": 0}, {"p": 32, "t": "What in the world?! 😭 At 51.. 💔 .. I would’ve turned around and been like “..isn’t your time coming soon? 🤨 you’ve been here long enough 😒..”", "l": 0}, {"p": 32, "t": "🥺❤️‍🩹", "l": 0}, {"p": 32, "t": "Mine did this to me at 51 while I was tending to my Father ( her husband, still) end of life Hospice. Just to make it sting a little more, my daughter was present.", "l": 0}, {"p": 33, "t": "Awwww sorry fren", "l": 158}, {"p": 33, "t": "You didn’t deserve that. Humans are so mean. I don’t like them much. What a painful thing to hear from your Dad. I’m sorry I", "l": 19}, {"p": 33, "t": "Same. I was helping my dad's shop out. Going to school full time and working at the shop 40 hours as week as a teenager. Unprovoked. He randomly tells me one day why are you so annoying and unloveable. I really thought something was wrong with me after that. Guess who is at a nursing home with nobody visiting him now.", "l": 7}, {"p": 33, "t": "I’m so sorry. That’s rough n I’m sure hurts..", "l": 6}, {"p": 33, "t": "I hope you know how much you're truly worth 💜", "l": 3}, {"p": 33, "t": "I grew up like this. It’s ok. We are ok. 👌", "l": 3}, {"p": 33, "t": "💔💔💔8 years old and working like an adult❤️❤️❤️", "l": 3}, {"p": 33, "t": "That was his way of saying you're all he has", "l": 2}, {"p": 33, "t": "No. Their voice in your head. Makes you determined. Not to be that way", "l": 2}, {"p": 33, "t": "Not to a little kid 😭 Jesus.. I hope you understand that had nothing to do with you.. he was self projecting his “misery” on to you..and unfortunately children are easy targets as we’re too young to defend ourselves .. 💔", "l": 2}, {"p": 33, "t": "That made my heart hurt for you. Mom hugs to that little boy💌", "l": 2}, {"p": 33, "t": "💔💔", "l": 2}, {"p": 33, "t": "My daughter is an only child; she went to work with her dad also; my point was that he should have been grateful and happy that you TRIED", "l": 2}, {"p": 33, "t": "I hope you have a family of your own that shows you that your loved 🥰and appreciated one day. 🥹🥹", "l": 1}, {"p": 33, "t": "It’s not ok though. Bc you grow up and their voice now lives in YOUR head telling you the things they once told you. Instead of it being im proud of myself it’s I hate myself i did such a bad job. these things stay with us if we don’t acknowledge it☹️☹️❤️‍🩹", "l": 1}, {"p": 33, "t": "I was the only son out of 3 girls", "l": 1}, {"p": 33, "t": "If only you knew the things my dad said to my brothers 😞 and us girls. They all still talk to him and respect him…I can’t understand it.", "l": 0}, {"p": 33, "t": "to an 8yo.... 😢", "l": 0}, {"p": 33, "t": "💙💙💙", "l": 0}, {"p": 33, "t": "i'm sure he didn't really mean it, just came out in a moment of frustration", "l": 0}, {"p": 34, "t": "that’s genuinely insane😭", "l": 228}, {"p": 34, "t": "", "l": 36}, {"p": 34, "t": "Doing alot better, weve been no contact for 8 years and I dont regret it even a little bit.", "l": 8}, {"p": 34, "t": "You should continue to do what feels right. Some people have no idea that their words can destroy a whole nation.", "l": 2}, {"p": 34, "t": "Jesus😞", "l": 0}, {"p": 34, "t": "This just makes me feel sad. Hope you are ok now.", "l": 0}, {"p": 34, "t": "Damn 💔💔💔", "l": 0}, {"p": 34, "t": "did you confront her? omg", "l": 0}, {"p": 34, "t": "💔💔", "l": 0}, {"p": 36, "t": "Disgusting omg💔😭", "l": 49}, {"p": 37, "t": "my mother passed 2 months ago. when I called her sister to say she was dying she said \"well thats sad but I wont be coming to her funeral. I never relly liked her\". I was heartbroken by that comment and then she showed up to her memorial.", "l": 124}, {"p": 37, "t": "took the higher road and was pleasant but it made me realize alot about someone I once had great respect for. in the end, its not worth the stress. I am a firm believer we get back what we put out in the world 💜", "l": 46}, {"p": 37, "t": "I am so sorry. I don't understand how people can be so unkind at the end of someone's life.", "l": 43}, {"p": 37, "t": "What did you say when she showed up?", "l": 10}, {"p": 37, "t": "Your a more forgiving person than my I would have kindly asked her to leave", "l": 8}, {"p": 37, "t": "why would he ever say that to her if he was going? ? ? Just why??", "l": 2}, {"p": 37, "t": "Very wise not your fight.", "l": 0}, {"p": 38, "t": "Yea that’s INSANE", "l": 22}, {"p": 38, "t": "I hope you are safe and happy love. You didn’t deserve that.", "l": 2}, {"p": 39, "t": "I am so sorry, like it was your fault.", "l": 17}, {"p": 39, "t": "wow. that just pissed me off so bad for you. I'm so sorry.", "l": 5}, {"p": 39, "t": "Thank you. ❤️", "l": 2}, {"p": 41, "t": "She was obviously a child at the time.", "l": 18}, {"p": 41, "t": "I hope you held him to his word.", "l": 8}, {"p": 41, "t": "how i would be so proud to have a strong beautiful daughter like you", "l": 1}, {"p": 41, "t": "Yeah. He also never came to visit me when I was going through cancer.", "l": 1}, {"p": 41, "t": "I’m so sorry, I had cancer too. We need to stick together, the H with the mean ones but doesn’t make it better!", "l": 1}, {"p": 41, "t": "Did you pick her side?", "l": 0}, {"p": 41, "t": "She was 14.", "l": 0}, {"p": 41, "t": "congratulations, 14 is a child", "l": 0}, {"p": 41, "t": "WTH", "l": 0}, {"p": 42, "t": "Oh this was the same aunt , when my brother passed she looked at me and said “idk why you crying you barley knew him” he was taken away from me and my dad when he was younger and when we finally reunited and he passed 5 months later", "l": 95}, {"p": 42, "t": "😳😳😳", "l": 0}, {"p": 43, "t": "“Former” best friend", "l": 39}, {"p": 43, "t": "hes not family", "l": 9}, {"p": 43, "t": "I asked my sister to take me to the urgent care after I had a nasty fall off my electric scooter. she said \"why can't you take an uber?\"", "l": 4}, {"p": 43, "t": "after they asked “why” what did you say?", "l": 0}, {"p": 43, "t": "I’m", "l": 0}, {"p": 44, "t": "I don't have any family left either but one day we will have the biggest family ever in paradise.", "l": 8}, {"p": 44, "t": "Family is what you make of it. I cut off all of my bloodline and life has never been better. 💕", "l": 2}, {"p": 44, "t": "Look I have family in Texas I have limited people in Chicago where I live. Believe me don’t feel bad. Heck I don’t want them to stay over.", "l": 1}, {"p": 44, "t": "I come from a big family, just my little brother and me and all of our cousins from my dads huge side of his family and my moms as well, my lil bro and me do not speak or talk to any of them (either sides), they treated us so bad for years and we saw it as love since we loved them. I promise you're not missing out on people who don't want to be in your life bc if they wanted to, they'd reach out, only child or not. 💗", "l": 1}, {"p": 44, "t": "Most families aren’t this rough, definitely cool and fun to have a big family lol", "l": 0}, {"p": 45, "t": "I’m in the same boat. My mother used to say this to me constantly and so did my dad. They still do and I have severe death anxiety and trauma.", "l": 19}, {"p": 45, "t": "Me just realizing this is why I was scared of death at a very young age! I remember my parents having the preacher come to talk to me about it at our home. It’s because they kept telling me I was going to cause it!", "l": 9}, {"p": 45, "t": "My mom does the same oh my gosh 💔 I’m the worst hypochondriac in the world too I constantly have panic attacks over her", "l": 1}, {"p": 45, "t": "💙💙", "l": 0}, {"p": 46, "t": "Awww I’m sorry you had to deal with that! I just experienced something similar about 2 months ago my dad kept repeating that I looked pregnant in front of everyone at a get together which was embarrassing and a reminder of why I never go around family", "l": 28}, {"p": 46, "t": "you’re gorgeous", "l": 0}, {"p": 47, "t": "to hear you aren’t wanted as a child is gut wrenching..", "l": 100}, {"p": 47, "t": "you can't be serious? it could have been put a better way.", "l": 27}, {"p": 47, "t": "Im sorry but what’s wrong w this?? 💀", "l": 25}, {"p": 47, "t": "Not everybody wants to be responsible for more than one child", "l": 2}, {"p": 47, "t": "Im not ragebaiting. “No i dont want to” in regards to adopting a child def hurts but i didn’t really fathom how shattering it was", "l": 1}, {"p": 48, "t": "Even if it happened years ago doesn’t mean it doent and shouldn’t affect you still. Parents mold their kids, most fear or anxiety or depression we have comes from childhood. Your brain can literally never forget that.", "l": 11}, {"p": 48, "t": "Same girl 😢 idk why I’ve always felt like I can change my mom ❤️‍🩹 but some people are just too stuck in their ways 😔", "l": 3}, {"p": 48, "t": "Exactly! 💯👏", "l": 3}, {"p": 48, "t": "\"Youre too sensitive\" and they never saw me vulnerable again. They will never get to know the authentic me bcuz they shut it down.", "l": 2}, {"p": 48, "t": "As difficult and hard as it, some people just don’t want to change or can’t change no matter how much you beg them to or want them to, you end up just burning yourself 😭", "l": 1}, {"p": 48, "t": "And then they wonder why we don’t talk anymore 🤷‍♀️🤷‍♀️", "l": 0}, {"p": 49, "t": "I don’t think he meant it in bad way. (Then again idk your dad lol) but some people say this because at some point you will put your partner before your parents. Could he have worded it better? Of course.", "l": 62}, {"p": 49, "t": "See I don’t understand this because even if you felt that way what about it is so necessary that you have to say it to a child? I remember this being said to me and it’s gut wrenching", "l": 32}, {"p": 49, "t": "There are people that feel that way about their spouses. I don’t get it. I’m sorry.", "l": 27}, {"p": 49, "t": "Putting you partner before your parents is way different than putting your partner before your own CHILD/CHILDREN", "l": 6}, {"p": 49, "t": "I've told my kids the same but in a much more supportive way. It's one of those conversations that must be delicately navigated.", "l": 5}, {"p": 49, "t": "Creepy", "l": 5}, {"p": 49, "t": "He may not be a great dad, but sounds like a great husband.", "l": 3}, {"p": 50, "t": "It is not anger..it is hurt😢", "l": 63}, {"p": 52, "t": "omg 💔💔💔💔💔💔", "l": 0}, {"p": 53, "t": "And I was present for these conversations", "l": 49}, {"p": 53, "t": "that is some of the worst I've read here", "l": 11}, {"p": 53, "t": "That’s so cruel and untrue. You matter and you always have. You didn’t deserve that pain", "l": 8}, {"p": 53, "t": "All I can do is be a good mom to my son. No alcohol, help with homework with a patient heart, teach him to help those who can’t help themselves, and always treat people the way God would. You can’t change what people think of you, but you can control how you feel, how you act, and how you react. Ok, now I’m crying 😩", "l": 5}, {"p": 53, "t": "Mom said the same screamed it in my face when I was 13 . I’m 45 that’s something that stuck with me forever", "l": 3}, {"p": 53, "t": "So against the odds you became a great mom! It takes high emotional intelligence to break cycles. Your positive parenting will ripple into future generations too 👏 ❤️", "l": 2}, {"p": 53, "t": "Do we have the same mom?", "l": 1}, {"p": 53, "t": "I talked to her today. She had a good day, I had a good day. 🥰 30 years later", "l": 0}, {"p": 54, "t": "on God I feel this one", "l": 16}, {"p": 56, "t": "My husband had the same issue. His aunt said he wasn’t really part of the family, to my Mom days after his Mom died. We didn’t tell him because he didn’t need that hurt. She told me not to send more pictures of our one year old, it wasn’t necessary, again, after his Mom died. I hate his aunt, miserable woman & hope she has been miserable since. How cruel.", "l": 16}, {"p": 56, "t": "Ugh so much trauma with adoption. I’m adopted as well. My niece and her wife talked about adopting and I was adamantly against it. They understand. I’m sorry you went through that.💜", "l": 11}, {"p": 56, "t": "Fortunately, my husband’s experience was very positive. He hung the moon as far as his parents were concerned, he was incredibly loved. He has no real interest in finding his birth parents because his only parents - to him - are those who raised him.", "l": 3}, {"p": 56, "t": "🤬🤬🤬", "l": 1}, {"p": 56, "t": "I would've shattered it all. Now none of us can have it! I think that's fair.", "l": 0}, {"p": 57, "t": "I’m on Hospice for stage four breast cancer. I’ve been told many times that it’s my fault because I didn’t pray enough. I’ve always believed in God and stuff like that makes you wonder.", "l": 35}, {"p": 57, "t": "Im so sad that you are in hospice. I hope you have a strong support group with you. I don’t believe God gives anyone cancer as a punishment or because they don’t pray enough. May you find solace and feel love during hospice. May you know peace at the end. Sending love. ❤️", "l": 10}, {"p": 57, "t": "Thank you so much! And I’m so sorry about your son. People are truly cruel. I’m doing this pretty much alone, but thank you. I hope you have a big support system as well. 🫂💜", "l": 1}, {"p": 58, "t": "ur doing a good job momma! I see you. carry on with ❤ love", "l": 3}, {"p": 58, "t": "Thank you😭 nobody has ever said that to me😭 I appreciate you so much!❤️", "l": 1}, {"p": 58, "t": "You are so very welcome! I'm delighted I could bid u such awesomeness! but I'm sorry no one has told u this before. 😔 best of luck my deat", "l": 1}, {"p": 58, "t": "thank you my friend! keep spreading the kindness!❤️", "l": 1}, {"p": 58, "t": "She definitely is", "l": 0}, {"p": 58, "t": "wish you the best", "l": 0}, {"p": 59, "t": "No. I couldn’t get past the betrayal. We tried. But that moment kept rearing its ugly head. I couldn’t/cant get over how he could be ok with a child (one that he said he loved so so much and was his) being hurt intentionally by his family. I would burn the world down for any child let alone MINE. We are friends and he is a great man and dad but that just is in the back of my head. He will tell anyone that was the biggest mistake of his life. I have forgiven him but I just can’t forget it.", "l": 81}, {"p": 59, "t": "You’re a good mom", "l": 2}, {"p": 60, "t": "Jesus I am so sorry 😞 I have also suffered multiple losses but not to your extent. I’m so sorry your mother treated you this way, the grief is not something that just stops 💔", "l": 13}, {"p": 61, "t": "", "l": 1}, {"p": 62, "t": "its not stupid 💕", "l": 5}, {"p": 62, "t": "It happened when I was 14 years old😞", "l": 0}, {"p": 63, "t": "Jesus", "l": 8}, {"p": 64, "t": "They can’t *", "l": 0}, {"p": 65, "t": "My mom who I have an other wise great relationship with said I looked like a sex worker when i found a dress I really liked I was about 19 also not sexually active another girl stood up to her and told her I looked beautiful and if I wanted the dress I should get it bought the dress myself and never had the confidence to wear it after that but I appricate that other girl so much", "l": 10}, {"p": 65, "t": "parents can be so harsh 🥺 i’m glad someone was in your corner in that moment ❤️", "l": 5}, {"p": 65, "t": "Im sorry that happened to you too nobody deserves to hear mean things from people who are supposed to be our biggest supporters", "l": 3}, {"p": 65, "t": "it be ya own people man", "l": 1}, {"p": 65, "t": "mine too but only did it twice 😂", "l": 0}, {"p": 66, "t": "Sorry to make “themselves” safe and loved", "l": 10}, {"p": 67, "t": "🥺 My mom said to me when I was 51 that the worst mistake she ever made in life was having kids. That was 6 years ago and I have been no contact ever sinc let cat='All',q='',sort='likes',shown=60;const $=s=>document.querySelector(s);

function list(){let xs=D.comments.filter(c=>(cat==='All'||(cat==='⭐ Starred'?stars.has(c.n):c.c.includes(cat)))&&(!q||c.t.toLowerCase().includes(q.toLowerCase())));

<div class="meta"><span>❤️ ${c.l.toLocaleString()}</span>${c.c.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}${byP[c.n]?`<button class="rbtn" data-r="${c.n}">💬 ${byP[c.n].length} replies</button>`:''}</div><div class="replies" id="r${c.n}" hidden></div></div>`).join('');
