function arm(g,side,H,style,t,wob){

 const ux=dx/(d||1), uy=dy/(d||1), mx=S[0]+ux*x, my=S[1]+uy*x;
 const c1=[mx-uy*h,my+ux*h], c2=[mx+uy*h,my-ux*h]; const score=c=>c[1]+(side==="L"?-c[0]:c[0])*.4; const E=score(c1)>score(c2)?c1:c2;
 const hx=S[0]+ux*dd, hy=S[1]+uy*dd; const path=`M${S[0]} ${S[1]} Q${E[0]} ${E[1]} ${hx} ${hy}`;
 el("path",{d:path,fill:"none",stroke:"#1b1230","stroke-width":92,"stroke-linecap":"round"},g);
 el("path",{d:path,fill:"none",stroke:"#8fc1ff","stroke-width":66,"stroke-linecap":"round"},g);

function drawArms(t,open){
 const g=$("armsG"); g.innerHTML="";
 const kf=TL.poses; let cur=kf[0],prev=kf[0]; for(const k of kf){ if(k.t<=t){prev=cur;cur=k} }
 const k=ease(clamp((t-cur.t)/.3,0,1)), A=POSES[prev.pose], B=POSES[cur.pose], same=prev===cur;
 const pos=side=>{const p=A[side],q=B[side]; const w=Math.sin(t*3.1+(side==="L"?0:2))*6; const sp=B.wave?Math.sin(t*16)*34*(side==="R"?1:0):0;

 if(prop==="box"){const e=el("g",{transform:"translate(0 655)"},g);el("rect",{x:-130,y:-60,width:260,height:130,rx:20,fill:"#fff",stroke:"#1b1230","stroke-width":10},e);for(let i=0;i<4;i++)el("circle",{cx:-80+i*53,cy:-48+(i%2)*14,r:28,fill:["#d9894a","#f2b25a","#a8622e","#e8a45c"][i],stroke:"#1b1230","stroke-width":6},e)}

 if(prop==="ear"){const e=el("g",{transform:`translate(${r[0]+4} ${r[1]-10}) rotate(14)`},g);el("rect",{x:-46,y:-92,width:92,height:184,rx:24,fill:"#ff8fc4",stroke:"#1b1230","stroke-width":10},e);el("rect",{x:-30,y:-70,width:60,height:120,rx:12,fill:"#eaf4ff"},e)}
 if(prop==="glass"){const e=el("g",{transform:`translate(${r[0]} ${r[1]-70}) rotate(${Math.sin(t*3)*4})`},g);el("path",{d:"M-44 -90 H44 L34 0 C28 36 -28 36 -34 0 Z",fill:"#ffe3f1",stroke:"#1b1230","stroke-width":9},e);el("path",{d:"M-38 -50 H38 L34 0 C28 36 -28 36 -34 0 Z",fill:"#ff73b3"},e);el("path",{d:"M0 34 V84 M-30 88 H30",stroke:"#1b1230","stroke-width":9,"stroke-linecap":"round"},e)}

}
function frame(f){

 // expression

 if(phase==="mail"){el("rect",{x:-48,y:-30,width:96,height:64,rx:8,fill:"#fff",stroke:"#1b1230","stroke-width":8},si);el("path",{d:"M-48 -26 L0 12 L48 -26",fill:"none",stroke:"#1b1230","stroke-width":8},si);el("circle",{cx:46,cy:-30,r:16,fill:"#ff2d55"},si)}
 if(phase==="no"){el("circle",{cx:0,cy:0,r:48,fill:"#ff4b5c"},si);el("path",{d:"M-22 -22 L22 22 M22 -22 L-22 22",stroke:"#fff","stroke-width":14,"stroke-linecap":"round"},si)}
 if(phase==="form"){for(let i=0;i<4;i++)el("rect",{x:-52,y:-70+i*38,width:104,height:20,rx:8,fill:"#c8d6ea"},si);el("rect",{x:-52,y:88,width:104,height:34,rx:12,fill:"#ff4fa3"},si)}

 // camera: punches + shakes + slow push

  rowsw.forEach((row,ri)=>{ if(!row.length)return; const tx=el("text",{x:540,y:1390+ri*104,"text-anchor":"middle","font-size":fs,fill:"#fff",stroke:"#1b1230","stroke-width":16,"paint-order":"stroke","stroke-linejoin":"round"},cg);

}
