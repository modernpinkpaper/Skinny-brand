name: Build Clip Maker (Windows)
on:
  push:
    paths: ["clip-maker/**", ".github/workflows/build-clip-maker.yml"]
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 150
    defaults: { run: { working-directory: clip-maker } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu
          pip install pyinstaller
      - name: Build ClipMaker.exe
        run: pyinstaller clipmaker.spec --noconfirm
      - name: Test the .exe (makes a tiny real video)
        run: dist\ClipMaker\ClipMaker.exe --selftest
      - name: Zip
        run: Compress-Archive -Path dist\ClipMaker -DestinationPath ClipMaker-Windows.zip
      - uses: actions/upload-artifact@v4
        with: { name: ClipMaker-Windows, path: clip-maker/ClipMaker-Windows.zip, retention-days: 90 }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: selftest-video, path: ~/Documents/Clip Maker/selftest/*.mp4, if-no-files-found: ignore }
