name: TikTok drafts
# Every night (three tries, first one wins): sends the next few finished videos (per_day in clip-maker/tiktok/settings) to your TikTok drafts,
# oldest first, and puts their captions on the "Today's TikTok drafts" Releases page. Setup: clip-maker/tiktok/README.md
on:
  schedule:
    # GitHub starts scheduled runs late, sometimes by hours (Sep 27-29: 4 to 7 hours). So there are three tries
    # a night, off the hour (on-the-hour schedules are delayed the most). The first one that runs sends the
    # day's videos; the later ones see today is done and stop. Times are UTC: about 2, 4 and 6 am New York time.
    - cron: "17 6 * * *"
    - cron: "17 8 * * *"
    - cron: "17 10 * * *"
  push:
    # Modern Pink Paper's computer updates this file every morning and pushes it, which starts a send right away
    # (GitHub's own timer above skipped Sep 30 entirely). Same once-a-day check as the timer.
    paths: ["clip-maker/tiktok/wake"]
  workflow_dispatch:
    inputs:
      action:
        description: "send = send the next videos now; link = get the TikTok login link; connect = finish connecting"
        type: choice
        options: [send, link, connect]
        default: send
      code:
        description: "For connect: paste the whole address you landed on after logging in to TikTok"
        required: false
permissions:
  contents: write
concurrency:
  group: tiktok-drafts
  cancel-in-progress: false
jobs:
  drafts:
    # a push only starts it on the main branch
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults: { run: { working-directory: clip-maker } }
    env:
      TZ: America/New_York   # "today" means New York's day, not GitHub's (UTC)
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      TIKTOK_STORE_KEY: ${{ secrets.TIKTOK_STORE_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - name: Check the TikTok secrets
        run: |
          if [ -z "$TIKTOK_CLIENT_KEY" ] || [ -z "$TIKTOK_CLIENT_SECRET" ] || [ -z "$TIKTOK_STORE_KEY" ]; then
            echo "TikTok drafts is not set up yet (see clip-maker/tiktok/README.md) - nothing to do."; echo "SKIP=1" >> "$GITHUB_ENV"
          fi
      - uses: actions/setup-python@v5
        if: env.SKIP != '1'
        with: { python-version: "3.11" }
      - name: Install
        if: env.SKIP != '1'
        run: pip install cryptography
      - name: TikTok
        if: env.SKIP != '1'
        env:
          ACTION: ${{ inputs.action || 'send' }}
          CODE: ${{ inputs.code }}
        run: |
          case "$ACTION" in
            link) python tiktok_drafts.py link ;;
            connect) python tiktok_drafts.py connect "$CODE" ;;
            *) if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then python tiktok_drafts.py send-once; else python tiktok_drafts.py send; fi ;;
          esac
      - name: Remember what was sent (and the TikTok login)
        if: always() && env.SKIP != '1'
        run: |
          git add tiktok/ 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"; git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "TikTok drafts: sent list / login updated"
          for try in 1 2 3 4; do
            git push -q origin "HEAD:${{ github.ref_name }}" && break
            git pull -q --rebase origin "${{ github.ref_name }}"; sleep $((try * 5))
          done
