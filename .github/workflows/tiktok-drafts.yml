name: TikTok drafts
# Every morning: sends the next few finished videos (per_day in clip-maker/tiktok/settings) to your TikTok drafts,
# oldest first, and puts their captions on the "Today's TikTok drafts" Releases page. Setup: clip-maker/tiktok/README.md
on:
  schedule:
    - cron: "23 11 * * *"   # 11:23 UTC = 7:23 am New York time (6:23 am in winter). Off the hour on purpose:
                            # GitHub delays on-the-hour schedules the most, so drafts usually land around 8 am.
  workflow_dispatch:
    inputs:
      action:
        description: "send = send the next videos now; link = get the TikTok login link; connect = finish connecting"
        type: choice
        options: [send, link, connect]
        default: send
      code:
        description: "For connect: paste the whole address you landed on after logging in to TikTok"
        required: false
permissions:
  contents: write
concurrency:
  group: tiktok-drafts
  cancel-in-progress: false
jobs:
  drafts:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults: { run: { working-directory: clip-maker } }
    env:
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      TIKTOK_STORE_KEY: ${{ secrets.TIKTOK_STORE_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - name: Check the TikTok secrets
        run: |
          if [ -z "$TIKTOK_CLIENT_KEY" ] || [ -z "$TIKTOK_CLIENT_SECRET" ] || [ -z "$TIKTOK_STORE_KEY" ]; then
            echo "TikTok drafts is not set up yet (see clip-maker/tiktok/README.md) - nothing to do."; echo "SKIP=1" >> "$GITHUB_ENV"
          fi
      - uses: actions/setup-python@v5
        if: env.SKIP != '1'
        with: { python-version: "3.11" }
      - name: Install
        if: env.SKIP != '1'
        run: pip install cryptography
      - name: TikTok
        if: env.SKIP != '1'
        env:
          ACTION: ${{ inputs.action || 'send' }}
          CODE: ${{ inputs.code }}
        run: |
          case "$ACTION" in
            link) python tiktok_drafts.py link ;;
            connect) python tiktok_drafts.py connect "$CODE" ;;
            *) python tiktok_drafts.py send ;;
          esac
      - name: Remember what was sent (and the TikTok login)
        if: always() && env.SKIP != '1'
        run: |
          git add tiktok/ 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"; git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "TikTok drafts: sent list / login updated"
          for try in 1 2 3 4; do
            git push -q origin "HEAD:${{ github.ref_name }}" && break
            git pull -q --rebase origin "${{ github.ref_name }}"; sleep $((try * 5))
          done
