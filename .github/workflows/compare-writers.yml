name: Compare script writers
# Writes the same few topics with each writer (best = Claude Opus 5, sonnet = Claude Sonnet 5, haiku = Claude
# Haiku 4.5) so you can compare the scripts and the cost. The result is at the bottom of the run's summary page.
on:
  push:
    paths: ["clip-maker/compare_writers.py", ".github/workflows/compare-writers.yml"]
  workflow_dispatch:
    inputs:
      link: { description: "TikTok link (leave empty to use the family post's saved comments)", required: false }
      topics: { description: "How many topics", required: false, default: "4" }
      writers: { description: "Writers to compare", required: false, default: "best,sonnet" }
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults: { run: { working-directory: clip-maker } }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install anthropic pydantic numpy
      - name: Write the scripts both ways
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LINK: ${{ inputs.link }}
          TOPICS: ${{ inputs.topics || '4' }}
          WRITERS: ${{ inputs.writers || 'best,sonnet' }}
        run: |
          if [ -n "$LINK" ]; then src=(--link "$LINK"); else src=(--csv ../research/post2-comments-all.csv); fi
          python compare_writers.py "${src[@]}" --topics "$TOPICS" --writers "$WRITERS" --out ../compare.md
          cat ../compare.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with: { name: writer-comparison, path: compare.md }
